<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Exercici 9 Contacta'm</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./css/main.css">
</head>

<body class="layout">

    <header>
        <h1>Contacta'm</h1>
    </header>

    <nav>
        <a href="#formulari">Formulari</a>
        <a href="#informacio">Informació</a>
    </nav>

    <main>

        <article id="formulari">
            <h2>Contacta amb mi</h2>

            <form>

                <label for="nom">Nom:</label>
                <input type="text" id="nom" name="nom" placeholder="Escriu el teu nom" required>

                <br><br>

                <label for="correu">Correu electrònic:</label>
                <input type="email" id="correu" name="correu" placeholder="Escriu el teu correu electrònic" required>

                <br><br>

                <label for="missatge">Missatge:</label>
                <br>

                <textarea id="missatge" name="missatge" placeholder="Escriu el teu missatge" rows="6"
                    cols="40"></textarea>

                <br><br>

                <input type="submit" value="Enviar">

            </form>
        </article>

    </main>

    <aside id="informacio">
        <h2>Informació</h2>
        <p>
            Omple el formulari amb el teu nom, correu i missatge
            per posar-te en contacte amb mi.
        </p>
    </aside>

    <aside>
        <h2>Contacte</h2>
        <p>
            Respondré el teu missatge tan aviat com pugui.
        </p>
    </aside>

    <footer>
        <p>© 2026 Contacta'm</p>
    </footer>

</body>
