<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Exercici 10 Registre Tipic</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./css/main.css">
</head>

<body class="layout">

    <header>
        <h1>Registre Típic</h1>
    </header>

    <nav>
        <a href="#registre">Crear compte</a>
        <a href="#informacio">Informació</a>
    </nav>

    <main>

        <article id="registre">
            <h2>Crea el teu compte</h2>

            <form>

                <label for="nom">Nom d'usuari:</label>
                <input type="text" id="nom" name="nom" placeholder="Escriu el teu nom" required>

                <br><br>

                <label for="correu">Correu electrònic:</label>
                <input type="email" id="correu" name="correu" placeholder="Escriu el teu correu" required>

                <br><br>

                <label for="contrasenya">Contrasenya:</label>
                <input type="password" id="contrasenya" name="contrasenya" placeholder="Crea una contrasenya" required>

                <br><br>

                <input type="checkbox" id="termes" name="termes" required>

                <label for="termes">
                    Accepto els termes i condicions
                </label>

                <br><br>

                <input type="submit" value="Crear compte">

            </form>
        </article>

    </main>

    <aside id="informacio">
        <h2>Informació</h2>
        <p>
            Omple les dades per crear el teu compte.
            Tots els camps són obligatoris.
        </p>
    </aside>

    <aside>
        <h2>Seguretat</h2>
        <p>
            Utilitza una contrasenya segura per protegir el teu compte.
        </p>
    </aside>

    <footer>
        <p>© 2026 Registre Típic</p>
    </footer>

</body>
